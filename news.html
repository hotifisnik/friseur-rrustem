<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | Friseur Rrustem</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #0a0a0a;
            --bg-card: #141414;
            --accent-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, .logo {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: rgba(10, 10, 10, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-gold);
            text-decoration: none;
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            cursor: pointer;
            z-index: 200;
        }

        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: var(--accent-gold);
            border-radius: 3px;
        }

        .nav-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background-color: rgba(10, 10, 10, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            transition: right 0.4s ease-in-out;
            z-index: 150;
        }

        .nav-overlay.active {
            right: 0;
        }

        .nav-overlay a {
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            color: #000;
            padding: 12px 24px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border-radius: 50px;
            text-transform: uppercase;
            text-decoration: none;
        }

        main {
            flex: 1;
            padding: 60px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .news-box {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .news-title {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .news-date {
            font-size: 1.3rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #050505;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Friseur Rrustem</a>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <nav class="nav-overlay" id="navMenu">
        <a href="index.html">Start / Home</a>
        <a href="index.html#services">Services & Preise</a>
        <a href="index.html#team">Die Barbiere</a>
        <a href="index.html#gallery">Galerie</a>
        <a href="index.html#contact">Laden & Zeiten</a>
        <a href="news.html">News & Aktionen</a>
        <a href="https://friseur-rrustem.setmore.com" target="_blank" class="btn-gold">Termin Buchen</a>
    </nav>

    <main>
        <h1 class="section-title">News</h1>
        <div class="news-box">
            <h2 class="news-title">NEUERÖFFNUNG</h2>
            <p class="news-date">am XX.XX.2026</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Friseur Rrustem | Barbershop</p>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }
    </script>
</body>
</html>
