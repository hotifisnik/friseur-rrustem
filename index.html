<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friseur Rustem | Wehrheim</title>
    <!-- FontAwesome für echte Social Media Logos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 40px 20px;
        }
        h1 {
            color: #d4af37; /* Edles Gold passend zum Logo */
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #aaaaaa;
            font-size: 1.1rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .info-box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #333;
        }
        .btn {
            display: inline-block;
            background-color: #d4af37;
            color: #000;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #f3c653;
        }
        /* Social Media Icons Styling */
        .social-links {
            margin: 30px 0;
        }
        .social-links a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background-color: #1e1e1e;
            color: #ffffff;
            border-radius: 50%;
            margin: 0 10px;
            font-size: 1.4rem;
            text-decoration: none;
            border: 1px solid #333;
            transition: 0.3s;
        }
        .social-links a:hover {
            background-color: #d4af37;
            color: #000;
            border-color: #d4af37;
        }
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #777;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Friseur Rustem</h1>
        <p class="subtitle">Damen & Herren • Hair • Color • Fade • Beard</p>
    </header>

    <div class="container">
        <div class="info-box">
            <h2>📍 Standort</h2>
            <p>Wiesenau 30, 61273 Wehrheim</p>
            <p>Rrustem & Qendrim</p>
            <a href="tel:+4915731646077" class="btn">📞 Jetzt anrufen & Termin sichern</a>
        </div>

        <!-- Social Media Logos -->
        <div class="social-links">
            <!-- Instagram -->
            <a href="https://www.instagram.com/friseur_rustem" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@friseur.rustem" target="_blank" aria-label="TikTok">
                <i class="fab fa-tiktok"></i>
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Friseur Rustem. Alle Rechte vorbehalten.
    </footer>

</body>
</html>
