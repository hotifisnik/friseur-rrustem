<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friseur Rustem | Damen & Herren | Wehrheim</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #0a0a0a;
            --bg-card: #141414;
            --accent-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-light: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        /* HEADER & LOGO */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: rgba(10, 10, 10, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-gold);
        }

        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-gold);
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 25px;
            height: 18px;
            cursor: pointer;
            z-index: 200;
        }

        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--accent-gold);
        }

        .nav-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background-color: rgba(10, 10, 10, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            transition: right 0.4s ease-in-out;
            z-index: 150;
        }

        .nav-overlay.active {
            right: 0;
        }

        .nav-overlay a {
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* HERO SECTION */
        .hero {
            height: 75vh;
            background: linear-gradient(180deg, rgba(10,10,10,0.7) 0%, rgba(10,10,10,1) 100%), 
                        url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1200&q=80') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: var(--accent-gold);
            line-height: 1.3;
        }

        .hero p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .btn-call {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            color: #000;
            padding: 12px 28px;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 50px;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        /* SECTIONS GENERAL */
        section {
            padding: 50px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
