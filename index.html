<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friseur Rustem | Wehrheim</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 3rem 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-tag {
            font-size: 0.85rem;
            letter-name: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        h1 span {
            color: var(--gold);
            font-weight: 600;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 1.2rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding-bottom: 0.5rem;
        }

        p, ul {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        ul {
            list-style: none;
        }

        ul li {
            padding: 0.4rem 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        ul li span:first-child {
            color: var(--text-main);
        }

        .team-names {
            color: var(--text-main);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
