<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friseur Rustem | Wehrheim</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark: #1a1a1a;
            --light: #f9f9f9;
            --white: #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--dark);
            color: var(--white);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1350&q=80') no-repeat center center/cover;
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        header h1 {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        header p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            max-width: 600px;
        }
        .btn {
            background-color: var(--primary);
            color: var(--dark);
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn:hover {
            background-color: #fff;
        }
        section {
            padding: 60px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .hours, .contact {
            text-align: center;
            margin-bottom: 40px;
        }
        h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
            text-transform: uppercase;
        }
        .card {
            background: #252525;
            padding: 30px;
            border-radius: 8px;
            border-top: 3px solid var(--primary);
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #111;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Friseur Rustem</h1>
        <p>Dein Look. Unser Handwerk. Damen & Herren in Wehrheim.</p>
        <a href="HIER_SETMORE_LINK_EINTRAGEN" class="btn">Termin buchen</a>
    </header>

    <section class="hours">
        <h2>Öffnungszeiten</h2>
        <div class="card" style="max-width: 400px; margin: 0 auto; text-align: left;">
            <p><strong>Montag – Freitag:</strong> 08:30 – 18:30 Uhr</p>
            <p><strong>Samstag:</strong> 08:00 – 17:00 Uhr</p>
            <p><strong>Sonntag:</strong> Geschlossen</p>
        </div>
    </section>

    <section class="contact">
        <h2>Kontakt & Standort</h2>
        <p>Wiesenau 30, 61273 Wehrheim</p>
    </section>

    <footer>
        <p>&copy; 2026 Friseur Rustem. Alle Rechte vorbehalten.</p>
    </footer>

</body>
</html>
